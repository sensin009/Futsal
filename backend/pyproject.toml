[project]
name = "football-backend"
version = "0.1.0"
description = "FastAPI backend for futsal/football club management."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-jose[cryptography]>=3.3.0",
  "bcrypt>=4.2.0",
  "python-multipart>=0.0.9",
  "email-validator>=2.1.1",
  "httpx>=0.27.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
